name: "bronze_click_inapp"
type: "custom"
ingestion_columns: true
execution_columns: true
from:
    path: "s3://data-raw-zone-will-{env}/salesforce/CLIQUEINAPP/{day}-{month}-{year}/*.csv"
    type: "csv"
    sep: "|"
to:
    path: "s3://data-bronze-zone-will-prod/comunicacoes_bronze/click_inapp/"
    type: "table"
    database: "comunicacoes_bronze"
    table_name: "click_inapp_sfi"
    mode: "append"
    partition_by: ["execution_year", "execution_month", "execution_day"]
